apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-portforward
  namespace: argocd
rules:
  # Argo CD Server Service 조회
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["argocd-server"]
    verbs: ["get"]

  # Service에 연결된 Pod 탐색
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Port Forward 실행
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-portforward-students
  namespace: argocd
subjects:
  - kind: User
    name: stud01
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: stud02
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: stud03
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: stud04
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: stud05
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: stud06
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: stud07
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: stud08
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: stud09
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: stud10
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: stud11
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: stud12
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: argocd-portforward
  apiGroup: rbac.authorization.k8s.io